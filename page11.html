<script>

// navigation
function showTab(id){
    document.querySelectorAll(".calculator").forEach(c=>c.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}

// helper to render MathJax
function renderMath() {
    if (window.MathJax) {
        MathJax.typesetPromise();
    }
}

// Z TEST
function runTest(){
let p1v = parseFloat(document.getElementById("p1").value);
let p2v = parseFloat(document.getElementById("p2").value);
let n1v = parseFloat(document.getElementById("n1").value);
let n2v = parseFloat(document.getElementById("n2").value);
let alpha = parseFloat(document.getElementById("alpha").value);
let type = document.getElementById("type").value;

if([p1v,p2v,n1v,n2v,alpha].some(v=>isNaN(v))){
    alert("Fill all fields");
    return;
}

// calculations
let ppool=(p1v*n1v+p2v*n2v)/(n1v+n2v);
let se=Math.sqrt(ppool*(1-ppool)*(1/n1v+1/n2v));
let z=(p1v-p2v)/se;

let critL,critU,pval;

if(type==="left"){
    critL=jStat.normal.inv(alpha,0,1);
    pval=jStat.normal.cdf(z,0,1);
}
else if(type==="right"){
    critU=jStat.normal.inv(1-alpha,0,1);
    pval=1-jStat.normal.cdf(z,0,1);
}
else{
    critL=jStat.normal.inv(alpha/2,0,1);
    critU=jStat.normal.inv(1-alpha/2,0,1);
    pval=2*(1-jStat.normal.cdf(Math.abs(z),0,1));
}

// OUTPUT IN LATEX
document.getElementById("z_pool").innerHTML = `\\( \\hat{p} = ${ppool.toFixed(5)} \\)`;
document.getElementById("z_se").innerHTML = `\\( SE = ${se.toFixed(5)} \\)`;
document.getElementById("z_stat").innerHTML = `\\( Z = ${z.toFixed(5)} \\)`;

document.getElementById("z_crit").innerHTML =
(type==="two")
? `\\( Z_{crit} = [${critL.toFixed(5)}, ${critU.toFixed(5)}] \\)`
: `\\( Z_{crit} = ${(critL ?? critU).toFixed(5)} \\)`;

document.getElementById("z_p").innerHTML = `\\( p\\text{-value} = ${pval.toFixed(5)} \\)`;

// render math
renderMath();
}

// CI
function runCI(){
let p1v = parseFloat(document.getElementById("ci_p1").value);
let p2v = parseFloat(document.getElementById("ci_p2").value);
let n1v = parseFloat(document.getElementById("ci_n1").value);
let n2v = parseFloat(document.getElementById("ci_n2").value);
let level = parseFloat(document.getElementById("ci_level").value)/100;

if([p1v,p2v,n1v,n2v,level].some(v=>isNaN(v))){
    alert("Fill all fields");
    return;
}

let z=jStat.normal.inv(1-(1-level)/2,0,1);
let se=Math.sqrt(p1v*(1-p1v)/n1v + p2v*(1-p2v)/n2v);
let me=z*se;

let lower=(p1v-p2v-me);
let upper=(p1v-p2v+me);

document.getElementById("ci_out").innerHTML =
`\\( CI = [${lower.toFixed(5)}, ${upper.toFixed(5)}] \\)`;

document.getElementById("ci_me").innerHTML =
`\\( ME = ${me.toFixed(5)} \\)`;

renderMath();
}

// Sample Size
function runSample(){
let p1v = parseFloat(document.getElementById("ss_p1").value);
let p2v = parseFloat(document.getElementById("ss_p2").value);
let conf = parseFloat(document.getElementById("ss_conf").value)/100;
let me = parseFloat(document.getElementById("ss_me").value)/100;

if([p1v,p2v,conf,me].some(v=>isNaN(v))){
    alert("Fill all fields");
    return;
}

let z=jStat.normal.inv(1-(1-conf)/2,0,1);
let n=(p1v*(1-p1v)+p2v*(1-p2v))*z*z/(me*me);

document.getElementById("ss_out").innerHTML =
`\\( n = ${Math.ceil(n)} \\)`;

renderMath();
}

</script>
