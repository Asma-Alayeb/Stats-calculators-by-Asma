<!DOCTYPE html>
<html lang="en">
<head>	
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confidence Intervals For The Mean</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #6a0dad;
            color: #fff;
            padding: 10px 0;
            text-align: center;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            z-index: 1000;
            border-bottom: 5px solid #b8860b;
        }
        header h1 { margin: 0; font-size: 24px; }

        nav {
            background-color: #800080;
            padding: 10px;
            text-align: center;
            position: fixed;
            width: 100%;
            top: 50px;
            left: 0;
            z-index: 999;
            border-top: 5px solid #b8860b;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
        }

        main {
            padding: 15px;
            max-width: 900px;
            margin: 0 auto;
            padding-top: 80px;
        }

        .calculator {
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            margin-bottom: 12px;
        }

        input {
            padding: 8px;
            font-size: 16px;
            width: 100%;
            max-width: 300px;
        }

        button {
            padding: 10px 15px;
            background-color: #6a0dad;
            color: white;
            border: none;
            cursor: pointer;
        }

        footer {
            background-color: #6a0dad;
            color: #fff;
            text-align: center;
            position: fixed;
            bottom: 0;
            width: 100%;
            font-size: 12px;
        }
    </style>

    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>

<body>

<header>
    <h1>T Estimate of a Mean</h1>
</header>

<nav>
    <a href="index.html">Home</a>
</nav>

<main>

<section class="calculator">
    <h2>Confidence Interval Calculator</h2>

    <p>Sample Mean: <input id="mean"></p>
    <p>Standard Deviation: <input id="stdDev"></p>
    <p>Sample Size: <input id="sampleSize"></p>
    <p>Confidence Level (%): <input id="confidenceLevel"></p>

    <button onclick="calculateConfidenceInterval()">Calculate Confidence Interval</button>

    <p id="ciResult"></p>
</section>

<section class="calculator">
    <h2>Sample Size Calculator</h2>

    <p>Margin of Error (E): <input id="marginError"></p>
    <p>Confidence Level (%): <input id="ssConfidenceLevel"></p>
    <p>Standard Deviation (σ): <input id="ssStdDev"></p>

    <button onclick="calculateSampleSize()">Calculate Sample Size</button>

    <p id="ssResult"></p>
</section>

</main>

<footer>
<p>&copy;2026 Asma S. Alayeb</p>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jstat/1.9.4/jstat.min.js"></script>

<script>

function calculateConfidenceInterval() {
    const mean = parseFloat(document.getElementById('mean').value);
    const stdDev = parseFloat(document.getElementById('stdDev').value);
    const n = parseInt(document.getElementById('sampleSize').value);
    const conf = parseFloat(document.getElementById('confidenceLevel').value) / 100;

    if (isNaN(mean) || isNaN(stdDev) || isNaN(n) || isNaN(conf)) return;

    const t = jStat.studentt.inv(1 - (1 - conf) / 2, n - 1);
    const ME = t * (stdDev / Math.sqrt(n));

    const low = mean - ME;
    const high = mean + ME;

    document.getElementById('ciResult').innerHTML =
        `CI: [${low.toFixed(4)}, ${high.toFixed(4)}]`;
}

function calculateSampleSize() {
    const marginError = parseFloat(document.getElementById('marginError').value);
    const confidenceLevel = parseFloat(document.getElementById('ssConfidenceLevel').value) / 100;
    const stdDev = parseFloat(document.getElementById('ssStdDev').value);

    if (
        isNaN(marginError) ||
        isNaN(confidenceLevel) ||
        isNaN(stdDev) ||
        marginError <= 0 ||
        confidenceLevel <= 0 ||
        confidenceLevel >= 1 ||
        stdDev <= 0
    ) {
        alert("Please enter valid positive numbers.");
        return;
    }

    const alpha = 1 - confidenceLevel;
    const z = jStat.normal.inv(1 - alpha / 2, 0, 1);

    const n = Math.pow((z * stdDev) / marginError, 2);
    const sampleSize = Math.ceil(n);

    const latex = `
    \\[
    n = \\left( \\frac{z_{\\alpha/2}\\sigma}{E} \\right)^2
    \\]
    `;

    document.getElementById('ssResult').innerHTML =
        `${latex}<br><b>Required Sample Size: ${sampleSize}</b>`;

    if (window.MathJax) {
        MathJax.typesetPromise();
    }
}

</script>

</body>
</html>
