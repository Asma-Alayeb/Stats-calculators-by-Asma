<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confidence Intervals For The Mean</title>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    margin: 0;
    padding: 0;
}

header {
    background-color: #6a0dad;
    color: #fff;
    padding: 10px 0;
    text-align: center;
    position: fixed;
    width: 100%;
    top: 0;
    z-index: 1000;
    border-bottom: 5px solid #b8860b;
}

nav {
    background-color: #800080;
    padding: 10px;
    text-align: center;
    position: fixed;
    width: 100%;
    top: 50px;
    z-index: 999;
}

nav a {
    color: white;
    text-decoration: none;
    font-weight: bold;
}

main {
    padding: 100px 15px 80px;
    max-width: 900px;
    margin: auto;
}

.calculator {
    background: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

input {
    padding: 8px;
    width: 100%;
    max-width: 300px;
}

button {
    padding: 10px 15px;
    background: #6a0dad;
    color: white;
    border: none;
    cursor: pointer;
}

button:hover {
    background: #800080;
}

footer {
    background-color: #6a0dad;
    color: white;
    text-align: center;
    position: fixed;
    bottom: 0;
    width: 100%;
    font-size: 12px;
}
</style>

</head>

<body>

<header>
<h1>T Estimate of a Mean</h1>
</header>

<nav>
<a href="index.html">Home</a>
</nav>

<main>

<section class="calculator">
<h2>Confidence Interval Calculator</h2>

<p>Sample Mean: <input id="mean"></p>
<p>Standard Deviation: <input id="stdDev"></p>
<p>Sample Size: <input id="sampleSize"></p>
<p>Confidence Level (%): <input id="confidenceLevel"></p>

<button onclick="calculateConfidenceInterval()">Calculate</button>

<p id="ciResult"></p>
</section>

<section class="calculator">
<h2>Sample Size Calculator</h2>

<p>Margin of Error (E): <input id="marginError"></p>
<p>Confidence Level (%): <input id="ssConfidenceLevel"></p>
<p>Standard Deviation (σ): <input id="ssStdDev"></p>

<button onclick="calculateSampleSize()">Calculate</button>

<p id="ssResult"></p>
</section>

</main>

<footer>
<p>&copy;2024 Asma S. Alayeb</p>
</footer>

<!-- LOAD JSTAT FIRST -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jstat/1.9.4/jstat.min.js"></script>

<script>

function calculateConfidenceInterval() {
    const mean = parseFloat(document.getElementById('mean').value);
    const stdDev = parseFloat(document.getElementById('stdDev').value);
    const n = parseInt(document.getElementById('sampleSize').value);
    const conf = parseFloat(document.getElementById('confidenceLevel').value) / 100;

    if (isNaN(mean) || isNaN(stdDev) || isNaN(n) || isNaN(conf) || n <= 1) {
        alert("Enter valid inputs.");
        return;
    }

    const t = jStat.studentt.inv(1 - (1 - conf) / 2, n - 1);

    const ME = t * (stdDev / Math.sqrt(n));

    const low = mean - ME;
    const high = mean + ME;

    document.getElementById('ciResult').innerHTML =
        `CI: [${low.toFixed(4)}, ${high.toFixed(4)}]`;
}

function calculateSampleSize() {
    const E = parseFloat(document.getElementById('marginError').value);
    const conf = parseFloat(document.getElementById('ssConfidenceLevel').value) / 100;
    const sigma = parseFloat(document.getElementById('ssStdDev').value);

    if (isNaN(E) || isNaN(conf) || isNaN(sigma) || E <= 0 || sigma <= 0) {
        alert("Enter valid inputs.");
        return;
    }

    const z = jStat.normal.inv(1 - (1 - conf) / 2, 0, 1);

    const n = Math.pow((z * sigma) / E, 2);

    document.getElementById('ssResult').innerHTML =
        `Required Sample Size: ${Math.ceil(n)}`;
}

</script>

</body>
</html>
