<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Two Proportion Z Test & Confidence Interval</title>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    margin: 0;
}
header, footer {
    background-color: #6a0dad;
    color: white;
    text-align: center;
    padding: 10px;
}
main {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}
.calculator {
    background: white;
    padding: 20px;
    border-radius: 8px;
    margin-bottom: 20px;
}
input, select, button {
    padding: 8px;
    margin: 5px 0;
}
button {
    background: #6a0dad;
    color: white;
    border: none;
    cursor: pointer;
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jstat/1.9.1/jstat.min.js"></script>
</head>

<body>

<header>
<h1>Two Proportion Z Tools</h1>
</header>

<main>

<!-- ================= TEST ================= -->
<section class="calculator">
<h2>Hypothesis Test</h2>

<select id="inputMethod" onchange="toggleInput()">
<option value="successes">Successes</option>
<option value="proportions">Proportions</option>
</select>

<div id="successInputs">
<p>x₁: <input id="x1"></p>
<p>n₁: <input id="n1"></p>
<p>x₂: <input id="x2"></p>
<p>n₂: <input id="n2"></p>
</div>

<div id="propInputs" style="display:none;">
<p>p₁: <input id="p1"></p>
<p>n₁: <input id="n1p"></p>
<p>p₂: <input id="p2"></p>
<p>n₂: <input id="n2p"></p>
</div>

<p>α: <input id="alpha"></p>

<select id="tail">
<option value="two">Two Tail</option>
<option value="left">Left</option>
<option value="right">Right</option>
</select>

<br>
<button onclick="runTest()">Run Test</button>

<p id="testOut"></p>
</section>

<!-- ================= CI ================= -->
<section class="calculator">
<h2>Confidence Interval</h2>

<select id="ciMethod" onchange="toggleCI()">
<option value="successes">Successes</option>
<option value="proportions">Proportions</option>
</select>

<div id="ciSuccess">
<p>x₁: <input id="cix1"></p>
<p>n₁: <input id="cin1"></p>
<p>x₂: <input id="cix2"></p>
<p>n₂: <input id="cin2"></p>
</div>

<div id="ciProp" style="display:none;">
<p>p₁: <input id="cip1"></p>
<p>n₁: <input id="cin1p"></p>
<p>p₂: <input id="cip2"></p>
<p>n₂: <input id="cin2p"></p>
</div>

<p>Confidence %: <input id="conf"></p>

<button onclick="runCI()">Calculate</button>

<p id="ciOut"></p>
</section>

</main>

<footer>
<p>Stats Calculator</p>
</footer>

<script>
// ================= TOGGLES =================
function toggleInput(){
document.getElementById("successInputs").style.display =
document.getElementById("inputMethod").value==="successes"?"block":"none";
document.getElementById("propInputs").style.display =
document.getElementById("inputMethod").value==="proportions"?"block":"none";
}

function toggleCI(){
document.getElementById("ciSuccess").style.display =
document.getElementById("ciMethod").value==="successes"?"block":"none";
document.getElementById("ciProp").style.display =
document.getElementById("ciMethod").value==="proportions"?"block":"none";
}

// ================= TEST =================
function runTest(){

let method=document.getElementById("inputMethod").value;
let p1,p2,n1,n2,x1,x2;

if(method==="successes"){
x1=+document.getElementById("x1").value;
n1=+document.getElementById("n1").value;
x2=+document.getElementById("x2").value;
n2=+document.getElementById("n2").value;
p1=x1/n1;
p2=x2/n2;
}else{
p1=+document.getElementById("p1").value;
n1=+document.getElementById("n1p").value;
p2=+document.getElementById("p2").value;
n2=+document.getElementById("n2p").value;
x1=p1*n1;
x2=p2*n2;
}

let alpha=+document.getElementById("alpha").value;
let tail=document.getElementById("tail").value;

// pooled
let pbar=(x1+x2)/(n1+n2);
let se=Math.sqrt(pbar*(1-pbar)*(1/n1+1/n2));

// z stat
let z=(p1-p2)/se;

// p-value
let pval;
if(tail==="two"){
pval=2*(1-jStat.normal.cdf(Math.abs(z),0,1));
}else if(tail==="left"){
pval=jStat.normal.cdf(z,0,1);
}else{
pval=1-jStat.normal.cdf(z,0,1);
}

// critical
let zcrit=jStat.normal.inv(1-alpha/2,0,1);

document.getElementById("testOut").innerHTML=
`z = ${z.toFixed(4)}<br>
p-value = ${pval.toFixed(4)}<br>
z* = ${zcrit.toFixed(4)}<br>
SE = ${se.toFixed(5)}`;
}

// ================= CI =================
function runCI(){

let method=document.getElementById("ciMethod").value;
let p1,p2,n1,n2;

if(method==="successes"){
let x1=+document.getElementById("cix1").value;
n1=+document.getElementById("cin1").value;
let x2=+document.getElementById("cix2").value;
n2=+document.getElementById("cin2").value;
p1=x1/n1;
p2=x2/n2;
}else{
p1=+document.getElementById("cip1").value;
n1=+document.getElementById("cin1p").value;
p2=+document.getElementById("cip2").value;
n2=+document.getElementById("cin2p").value;
}

let conf=+document.getElementById("conf").value/100;

// correct z*
let z=jStat.normal.inv(1-(1-conf)/2,0,1);

// SE (no pooling!)
let se=Math.sqrt(p1*(1-p1)/n1 + p2*(1-p2)/n2);

let me=z*se;
let diff=p1-p2;

let low=diff-me;
let high=diff+me;

document.getElementById("ciOut").innerHTML=
`CI: (${low.toFixed(4)}, ${high.toFixed(4)})<br>
ME = ${me.toFixed(4)}<br>
z* = ${z.toFixed(4)}<br>
SE = ${se.toFixed(5)}`;
}

</script>

</body>
</html>
